schema_version: 1
id: example-lora-outfit-transfer
type: render
intent: Test outfit transfer while holding other declared conditions fixed.
inputs:
  train_run: example-train-run
  checkpoint: {path: runs/example-train-run/outputs/example.safetensors, hash: null}
  workflow: {path: workflows/example-api.json, digest: null}
  promptset: {path: examples/lora-evaluation/promptset-outfit-transfer.jsonl, digest: null}
generator: {name: comfyui, endpoint: 'http://127.0.0.1:8188'}
executor: {name: local}
workflow_patches: {}
render: {output_dir: samples/images, timeout_sec: 600, default_seed: 42}
evaluation:
