ai_toolkit_embedded_audio_preflight:
  architecture: ltx2.5
  dataset_config: {num_frames: 9, fps: 24, do_audio: true}
  download_guard: >-
    The base is a tiny hub repo, so any LTX-2.5 file resolution after the
    preflight fails with a 404 instead of downloading LTX-2.5; no LTX weights
    existed in the managed model cache.
  defect_found:
    runs: [20260929-0143_audio-missing-preflight_0370, 20260929-0143_audio-present-preflight_c149]
    observation: >-
      Both videos, with and without audio, failed inside the pinned loader
      ("expected Tensor ... got Image") because the preflight called
      load_and_process_video without the dataset's tensor transform.
    fix_commit: 35f3b8a
  adapter_source_after_fix: b5cfb76927baa383b24452bdb0ddc3c96d7a188ccb29540748a8a26feb35be71
  negative:
    run_id: 20260929-0146_audio-missing-preflight-fixed_0d5b
    video: 2 s, 256x256, no audio stream
    record_status: failed
    error: the pinned AI-Toolkit loader produced no usable audio tensor
    trainer_started: false
  positive:
    run_id: 20260929-0146_audio-present-preflight-fixed_8f1d
    video: 2 s, 256x256, AAC 440 Hz
    record_status: passed
    trainer_started: true
    later_failure: expected 404 for the LTX-2.5 transformer in the tiny repo; no download
sd_scripts_avif:
  command: python -c "import pillow_avif" inside the pinned sd-scripts image
  result: ModuleNotFoundError (exit 1)
  pillow: 11.0.0 without an AVIF plugin
  upstream_gate: library/dataset.py adds .avif only after importing pillow_avif
  conclusion: excluding .avif from SD_SCRIPTS_IMAGE_SUFFIXES matches the pinned image
scope: >-
  Proves the final manifest-v2 handoff end to end on real trainers: the
  AI-Toolkit trainer reads Kura's run-owned view for root-level and images/
  layouts; the RunPod path transfers only selected files, verifies them on the
  Pod before model acquisition, and returns its records; local-path models and
  Resume state are mounted read-only; the embedded-audio preflight rejects a
  silent video and accepts one with audio. It does not establish LoRA quality,
  LTX-2.5 training, or other backends' runtime behavior.
