    evidence: source, local render below
  - delta: assets system (off by default) adds id/preview_id to outputs only when enabled
    kura_status: not affected
    action: none
    evidence: source
  - delta: CLI flags (--listen/--port unchanged; --disable-api-nodes now an alias of --offline; new --disable-comfy-compiler, --disable-cuda-graphs)
    kura_status: Kura passes only --listen/--port
    action: none
    evidence: source, local start below
  - delta: model folder names (only datasets and previews added)
    kura_status: kura_comfy_prepare.py paths unchanged
    action: none
    evidence: source
  - delta: requirements (torchaudio dropped, comfy-kitchen 0.2.37, comfy-aimdo 0.5.6, frontend 1.55.17); torch still unpinned
    kura_status: absorbed by the rebuild; the image keeps the base torch 2.11.0+cu130 (the Dockerfile CUDA check passed)
    action: rebuild
    evidence: image build, pip list in the image
  - delta: Comfy Compiler / CUDA graphs and DynamicVRAM on by default where aimdo and CUDA are present
    kura_status: behavior change; local start log shows DynamicVRAM enabled; RunPod first-inference time and VRAM not yet observed
    action: observe on the RunPod render
    evidence: local render below
  - delta: shipped workflow samples (anima, sd1.5, sdxl, flux2-klein, z-image, qwen-image 2512 and edit-2511, krea2, ideogram4)
    kura_status: every API class_type is registered in /object_info; only Anima base rendered end to end
    action: re-render the other samples on the new image
    evidence: object_info probe, local render below
  - delta: changed sample nodes (ResolutionSelector optional preview input, ModelSamplingAuraFlow optional sampling, EmptyLatentImage default 512 to 1024, ConditioningZeroOut also zeroes conditioning_scale/direct_context)
    kura_status: optional or defaulted inputs; API samples set their values explicitly
    action: none
    evidence: source
  - delta: ModelPatchLoader gains detection branches (Qwen Image 2.1 Fun, MiniMax H3 Fun, Uni3C); AnimaLLLiteApply moved category only
    kura_status: both nodes registered with the same required inputs; Anima LLLite weights not loaded on the new image
    action: one Anima LLLite render
    evidence: object_info probe
  - delta: LoRA key maps (Qwen Image 2.1, Flux3, MiniMax H3, HiDream O1 added; existing families unchanged)
    kura_status: LoraLoader and LoraLoaderModelOnly registered; no Kura-trained LoRA rendered on the new image
    action: one render with a Kura-trained LoRA
    evidence: source, object_info probe
  - delta: new families renderable in user workflows (Qwen Image 2.1, Flux3, MiniMax H3, Trellis2, others)
    kura_status: generic (user workflows); no shipped sample; the old pin had no Qwen Image 2.1 support
    action: none in this change
    evidence: source
  - delta: 16 partner API nodes removed (Kling, OpenAI Dalle/Sora, Veo, ByteDance and similar)
    kura_status: unused by Kura and its samples
    action: none
    evidence: static registration diff
