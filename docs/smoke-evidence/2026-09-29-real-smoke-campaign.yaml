scope: Each listed selector completed one optimizer step with a finite loss, published
  its adapter, and matched its input postflight; RunPod runs also stopped their Pod.
ai_toolkit_failures:
  flux2_klein_4b_first_attempt:
    run_id: 20260929-1625_ai-toolkit-flux2-klein-4b_5c88
    error: 'diffusers FlowMatch set_timesteps: mu must be passed when use_dynamic_shifting
      is True'
    cause: the run carried no train.noise_scheduler, so AI-Toolkit took its DDPM branch;
      the retry with the UI training defaults passed
  krea2:
    run_id: 20260929-1652_ai-toolkit-krea2_c692
    error: mu must be passed when use_dynamic_shifting is True
    cause: the smoke carried only the architecture entry, not the UI base job noise_scheduler
      flowmatch
  flex2:
    run_id: 20260929-1652_ai-toolkit-flex2_b442
    error: 'AttributeError: ''NoneType'' object has no attribute ''shape'' in flex2.condition_noisy_latents'
    cause: Kura always emits cache_latents_to_disk true; pinned flex2.py reads batch.tensor,
      which is None while latents are cached (Kontext, Qwen Edit, and HiDream E1 guard
      this case)
  flux:
    run_id: 20260929-1652_ai-toolkit-flux_3392
    error: CUDA out of memory on a 44 GiB A40
    cause: not yet diagnosed; the upstream example targets 24 GB
  hidream:
    run_id: 20260929-1652_ai-toolkit-hidream_e1eb
    error: process killed (137) while loading checkpoint shards
    cause: likely host RAM exhaustion on the about 50 GB A40 Pod before quantization
  qwen_image:
    run_id: 20260929-1652_ai-toolkit-qwen-image_2975
    error: process killed (137) while loading the model
    cause: likely host RAM exhaustion on the about 50 GB A40 Pod before quantization
  qwen_image_edit:
    run_id: 20260929-1652_ai-toolkit-qwen-image-edit_1396
    error: process killed (137) while loading checkpoint shards
    cause: likely host RAM exhaustion on the about 50 GB A40 Pod before quantization
  mageflow:
    run_id: null
    cause: 'not run: the pinned UI default microsoft/Mage-Flow-Base does not exist
      on the Hub'
musubi_video_preflight_stop:
  framepack:
    run_id: 20260929-1857_musubi-framepack_7e73
    observation: Kura's container frame preflight found 30 converted frames where
      target_frames requires 37 and stopped before model acquisition; the transfer
      and input postflight matched and the Pod stopped
    cause: the generated 37-frame smoke video is too short after the pinned loader's
      frame conversion; a longer smoke video is needed, not a Kura change
ai_toolkit_baseline_rerun:
  adapter_change: docs/adr/upstream-training-baseline.md (pinned UI training baseline)
  resolved_failures:
    krea2: ai-toolkit-krea2-2026-09-29-2323 passed with the baseline noise_scheduler
    flux: ai-toolkit-flux-2026-09-29-2323 passed with the baseline bf16 precision
      and quantization
    flex2: ai-toolkit-flex2-2026-09-29-2323 passed with the baseline cache_latents_to_disk
      false
  still_open:
  - 'mageflow: pinned default repository does not exist'
host_ram_and_framepack_follow_up:
  host_ram: The A40 Pod container is capped at 50 GB of host RAM (cgroup memory.max
    49999998976, memory.peak at the cap, oom_kill 1) for AI-Toolkit HiDream, Qwen-Image,
    and Qwen-Image-Edit. The same smokes passed on an A100 80GB PCIe Pod (COMMUNITY
    1.19 USD/h).
  a100_ssh_retry: The first A100 HiDream attempt (20260930-0040_ai-toolkit-hidream_e5dc)
    never reached SSH; Kura left the Pod running because completion was not confirmed,
    and it was stopped after checking no upload had happened (about 0.22 USD).
  framepack: The pinned Musubi loader only drops frames and stops at the converted
    index, so a 24 fps source cannot fill FramePack's 37-frame window at its 30 fps
    target (a 73-frame 24 fps video also converted to 30). A 45-frame 30 fps smoke
    video yields 37 frames and passed.
