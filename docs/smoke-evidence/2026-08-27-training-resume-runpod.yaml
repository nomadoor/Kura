  required_sequence:
    - complete source training and download a valid protected training-state artifact
    - stop and remove the source Pod
    - create a derived run that freezes the selected artifact ID and manifest hash
    - upload the selected artifact to a different Pod
    - restore backend-declared state and perform one optimizer update
    - download logical step 3 state before stopping the derived Pod
  scope: This proves artifact portability and disposable-Pod lifecycle behavior. It does not prove bitwise equivalence with uninterrupted training.
