observations:
  - The first AI-Toolkit attempt failed before Pod creation because the previously configured registry digest no longer existed. Current images were published under unique tags and frozen by content digest before the passing runs.
  - An A5000 Resume attempt waited for 120 capacity probes over one hour and ended before Pod creation. No Pod or billing resource remained.
  - The run remote command does not inherit compute.capacity from the compiled run; advanced direct use must pass wait-for-capacity and capacity-poll-interval explicitly. The normal run execute path reads the frozen capacity policy.
