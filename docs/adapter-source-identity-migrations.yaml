schema_version: 1
description: >-
  Mechanical identity transitions for backend adapters (keyed by backend) and
  executors (keyed by executor). These records explain source-identity
  changes only; they do not transfer runtime evidence to behavior changes.
  The legacy helper applies the old algorithm to the current tree and therefore
  cannot reproduce these previous values without the corresponding historical
  tree. Evidence older than the listed transition pairs remains stale for its
  original identity and is not implicitly migrated.
