        - https://github.com/ostris/ai-toolkit/commit/d1985f9bf380b6ce1c409b7875e2d367df486e19
    - name: musubi-tuner
      from: {kind: git-tag, value: v0.3.4}
      to: {kind: git-commit, value: 4e7c7149249e7715e9168920feb4c420423abba7}
      source_refs:
        - https://github.com/kohya-ss/musubi-tuner/compare/v0.3.4...v0.3.5
        - https://github.com/kohya-ss/musubi-tuner/releases/tag/v0.3.5

changes:
  - id: ai-qwen-image-2
    backend: ai-toolkit
    summary: Qwen-Image 2.1 text-to-image and edit/control implementations were added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/diffusion_models/qwen_image_2]
  - id: ai-anima
    backend: ai-toolkit
    summary: Anima image training was added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/diffusion_models/anima]
  - id: ai-mageflow
    backend: ai-toolkit
    summary: Mage-Flow base and edit/control implementations were added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/diffusion_models/mageflow]
  - id: ai-ltx25
    backend: ai-toolkit
    summary: LTX-2.5 image, video, audio-video, and conditioned video paths were added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/diffusion_models/ltx2]
  - id: ai-minimax-h3
    backend: ai-toolkit
    summary: MiniMax-H3 base, first-frame, Ref2VA, VSA/Fast, image, video, and optional-audio paths were added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/diffusion_models/minimax_h3]
  - id: ai-yue2
    backend: ai-toolkit
    summary: YuE2 audio training was added.
    kind: outside-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/audio_models/yue2]
  - id: ai-qwen25-omni
    backend: ai-toolkit
    summary: Qwen2.5-Omni language-model training was added.
    kind: outside-contract
    source_refs: [https://github.com/ostris/ai-toolkit/blob/31ddc709c35d3d3b820c636745397561f806b246/extensions_built_in/llm_models/qwen25_omni.py]
  - id: ai-runtime-refresh
    backend: ai-toolkit
    summary: The pinned image's Python and model-library dependency set changed with the release.
    kind: enhancement
    source_refs: [https://github.com/ostris/ai-toolkit/compare/a4bbe167ce03521bf9052d2349f01b2997d67ac7...31ddc709c35d3d3b820c636745397561f806b246]
  - id: musubi-minimax-h3
    backend: musubi-tuner
    summary: MiniMax-H3 T2VA, FL2VA, Ref2VA, and one-frame image training were added.
    kind: execution-contract
    source_refs: [https://github.com/kohya-ss/musubi-tuner/blob/v0.3.5/docs/minimax_h3.md]
  - id: musubi-minimax-h3-loss-recipes
    backend: musubi-tuner
    summary: Training-adapter, guidance-loss, and teacher-matching recipes were added for MiniMax-H3.
    kind: execution-contract
    source_refs: [https://github.com/kohya-ss/musubi-tuner/blob/v0.3.5/docs/minimax_h3.md#choosing-a-training-recipe--]
  - id: musubi-minimax-h3-mixed
    backend: musubi-tuner
    summary: Mixed image and video datasets are described as expected to work but untested upstream.
    kind: enhancement
    source_refs: [https://github.com/kohya-ss/musubi-tuner/blob/v0.3.5/docs/minimax_h3.md#choosing-a-training-recipe--]
  - id: musubi-krea-convrot
    backend: musubi-tuner
    summary: Krea 2 ConvRot INT8 execution was added.
    kind: enhancement
    source_refs: [https://github.com/kohya-ss/musubi-tuner/releases/tag/v0.3.5]
  - id: musubi-krea-offload
    backend: musubi-tuner
    summary: Krea 2 checkpoint CPU offload was added.
    kind: enhancement
    source_refs: [https://github.com/kohya-ss/musubi-tuner/releases/tag/v0.3.5]
  - id: musubi-krea-turbo
    backend: musubi-tuner
    summary: Krea 2 Turbo LoRA composition was added to sampling.
    kind: enhancement
    source_refs: [https://github.com/kohya-ss/musubi-tuner/releases/tag/v0.3.5]
  - id: musubi-audio-sidecars
    backend: musubi-tuner
    summary: Audio sidecars and JSONL-relative media paths were added to shared datasets.
    kind: execution-contract
    source_refs: [https://github.com/kohya-ss/musubi-tuner/blob/v0.3.5/docs/minimax_h3.md#dataset-configuration--]

