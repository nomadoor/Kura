schema_version: 1
upgrade:
  id: 2026-10-17-ai-toolkit-0.13.30
  status: complete
  backends:
    - name: ai-toolkit
      from: {kind: embedded-git-commit-plus-patch, value: "31ddc709c35d3d3b820c636745397561f806b246+d1985f9bf380b6ce1c409b7875e2d367df486e19"}
      to: {kind: embedded-git-commit-plus-patch, value: "dcebc7442df70e5239c68167919fd2909c615769+d1985f9bf380b6ce1c409b7875e2d367df486e19"}
      source_refs:
        - https://github.com/ostris/ai-toolkit/compare/31ddc709c35d3d3b820c636745397561f806b246...dcebc7442df70e5239c68167919fd2909c615769

changes:
  - id: ai-flux3
    backend: ai-toolkit
    summary: FLUX.3 Image (arch flux3) was added; text-to-image plus reference i2i that reads one reference per sample.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/dcebc7442df70e5239c68167919fd2909c615769/extensions_built_in/diffusion_models/flux3]
  - id: ai-iris3b
    backend: ai-toolkit
    summary: Iris-3B (arch iris3b), a pixel-space text-to-image model, was added.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/dcebc7442df70e5239c68167919fd2909c615769/extensions_built_in/diffusion_models/iris3b]
  - id: ai-ming-image
    backend: ai-toolkit
    summary: Ming-Image (arch ming_image) text-to-image with a training adapter was added; a single-reference edit path exists in the trainer but not in the upstream UI.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/dcebc7442df70e5239c68167919fd2909c615769/extensions_built_in/diffusion_models/ming_image]
  - id: ai-moss-image
    backend: ai-toolkit
    summary: MOSS-Image (arch moss_image, UI entries moss_image:base and moss_image:base_edit) was added; model_kwargs.edit turns on multi-reference edit.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/tree/dcebc7442df70e5239c68167919fd2909c615769/extensions_built_in/diffusion_models/moss_image]
  - id: ai-qwen-image-2-turbo
    backend: ai-toolkit
    summary: The qwen_image_2:turbo UI entry trains the 8-step distilled Qwen-Image 2.1 (model_kwargs.turbo); its assistant training adapter is native_config.model.assistant_lora_path, which Kura's baseline does not fill.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/commit/f370e74]
  - id: ai-qwen-image-2-references
    backend: ai-toolkit
    summary: Qwen-Image 2.1 passes reference images unresized (use_raw_control_images) and scales them to the target's area (model_kwargs.match_target_res, default true); its text-embedding cache is keyed on that, and with batch_size above 1 the trainer refuses references whose token counts differ within a batch.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/commit/07abdbe]
  - id: ai-minimax-h3-vsa-weights
    backend: ai-toolkit
    summary: minimax_h3_vsa now trains the FastH3 8-step V2 weights from model.base FastVideo/FastVideo-FastH3-Comfy (training shift 10, vsa_sparsity 0.8, was 0.9) and gained a UI baseline entry; the MiniMax entries drop contrastive guidance defaults and their training adapter is native_config.model.assistant_lora_path.
    kind: execution-contract
    source_refs: [https://github.com/ostris/ai-toolkit/commit/a776394, https://github.com/ostris/ai-toolkit/commit/60d0c28]
  - id: ai-train-options
    backend: ai-toolkit
    summary: New native options train.loss_type band, train.pool_datasets, and model_kwargs rgba, match_target_res, turbo, kv_cache and similar; all reach the trainer through native_config unchanged.
    kind: enhancement
    source_refs: [https://github.com/ostris/ai-toolkit/commit/831ccfa, https://github.com/ostris/ai-toolkit/commit/a949f21, https://github.com/ostris/ai-toolkit/commit/086b663]
  - id: ai-loader-internals
    backend: ai-toolkit
    summary: Loader and loading internals changed without a surface change (uint8 cached pixel tensors, threaded batch loading, tokenizer online fallback, comfy-format loading, text-encoder unload fixes, Qwen-Image Edit Plus batch fixes); suffix lists and the save, load, step, and metadata code Kura hooks are unchanged.
    kind: enhancement
    source_refs: [https://github.com/ostris/ai-toolkit/compare/31ddc709c35d3d3b820c636745397561f806b246...dcebc7442df70e5239c68167919fd2909c615769]
  - id: ai-dgx-spark
    backend: ai-toolkit
    summary: DGX Spark (integrated GPU) support, unified-memory patches that apply only on integrated NVIDIA GPUs, and the matching UI and manager changes.
    kind: outside-contract
    source_refs: [https://github.com/ostris/ai-toolkit/commit/60ca869, https://github.com/ostris/ai-toolkit/commit/16ae8d2]
  - id: ai-yue2-heads
    backend: ai-toolkit
    summary: YuE2 loads safetensors semantic heads and NAR adapters.
    kind: outside-contract
    source_refs: [https://github.com/ostris/ai-toolkit/commit/d0ecde7]

