# CodeRabbit reviews a pull request only when someone comments
# "@coderabbitai review" (see AGENTS.md, "How a change is made").
inheritance: true
reviews:
  auto_review:
    enabled: false
  # Generated skill mirrors (scripts/sync_agent_skills.py); their sources are reviewed.
  path_filters:
    - "!.agents/skills/**"
    - "!.claude/skills/**"
